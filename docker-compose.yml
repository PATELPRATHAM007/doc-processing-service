services:
  db:
    image: postgres:16-alpine
    container_name: doc_service_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: doc_processing_db
    ports:
      - "${DB_PORT:-6432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doc_processing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: doc_service_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-7379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_service_web
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000", "--reload"]
    ports:
      - "${PORT:-9000}:9000"
    environment:
      PORT: 9000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@db:5432/doc_processing_db"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OCR_PROVIDER: ${OCR_PROVIDER:-gemini}
      PADDLEOCR_VL_PIPELINE_VERSION: ${PADDLEOCR_VL_PIPELINE_VERSION:-v1.6}
      PADDLEOCR_VL_MODEL_NAME: ${PADDLEOCR_VL_MODEL_NAME:-PaddlePaddle/PaddleOCR-VL-1.6}
      PADDLEOCR_VL_BACKEND: ${PADDLEOCR_VL_BACKEND:-vllm-server}
      PADDLEOCR_VL_SERVER_URL: ${PADDLEOCR_VL_SERVER_URL:-http://localhost:8080/v1}
      PADDLEOCR_VL_DEVICE: ${PADDLEOCR_VL_DEVICE:-cpu}
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc_service_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@db:5432/doc_processing_db"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      OCR_PROVIDER: ${OCR_PROVIDER:-gemini}
      PADDLEOCR_VL_PIPELINE_VERSION: ${PADDLEOCR_VL_PIPELINE_VERSION:-v1.6}
      PADDLEOCR_VL_MODEL_NAME: ${PADDLEOCR_VL_MODEL_NAME:-PaddlePaddle/PaddleOCR-VL-1.6}
      PADDLEOCR_VL_BACKEND: ${PADDLEOCR_VL_BACKEND:-vllm-server}
      PADDLEOCR_VL_SERVER_URL: ${PADDLEOCR_VL_SERVER_URL:-http://localhost:8080/v1}
      PADDLEOCR_VL_DEVICE: ${PADDLEOCR_VL_DEVICE:-cpu}
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
